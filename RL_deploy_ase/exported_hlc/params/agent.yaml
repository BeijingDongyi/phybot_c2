seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 50000
empirical_normalization: false
policy:
  class_name: ActorCritic
  init_noise_std: 0.5
  noise_std_type: scalar
  actor_hidden_dims:
  - 256
  - 256
  - 128
  critic_hidden_dims:
  - 256
  - 256
  - 128
  activation: elu
algorithm:
  class_name: PPO
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  entropy_coef: 0.001
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  desired_kl: 0.01
  max_grad_norm: 1.0
  normalize_advantage_per_mini_batch: false
  symmetry_cfg: null
  rnd_cfg: null
clip_actions: null
save_interval: 100
experiment_name: phybot_walk_hlc
run_name: ''
logger: tensorboard
neptune_project: phybot_walk_hlc
wandb_project: phybot_walk_hlc
resume: false
load_run: 2026-03-23_14-30-14
load_checkpoint: model_.*.pt
runner_class_name: HierarchicalLatentOnPolicyRunner
llc_task_name: phybot_walk
llc_load_run: .*
llc_load_checkpoint: model_.*.pt
hlc_clip_stride_frames: 5
hlc_steps: 5
hlc_reward_scale: 1.0
hlc_skill_reward_scale: 1.0
hlc_skill_residual_scale: 0.2
hlc_skill_command_min_time_s: 3.0
hlc_skill_command_max_time_s: 5.0
