        - .*_shoulder_pitch
        - .*_shoulder_roll
        - .*_shoulder_yaw
        - .*_elbow_pitch
        effort_limit: null
        velocity_limit: null
        effort_limit_sim:
          waist_yaw: 58.0
          .*_shoulder_pitch: 58.0
          .*_shoulder_roll: 58.0
          .*_shoulder_yaw: 58.0
          left_elbow_pitch: 9.0
          right_elbow_pitch: 58.0
        velocity_limit_sim:
          waist_yaw: 98.37
          .*_shoulder_pitch: 98.37
          .*_shoulder_roll: 98.37
          .*_shoulder_yaw: 98.37
          left_elbow_pitch: 98.16
          right_elbow_pitch: 98.37
        stiffness:
          waist_yaw: 100.0
          .*_shoulder_pitch: 50.0
          .*_shoulder_roll: 50.0
          .*_shoulder_yaw: 5.0
          .*_elbow_pitch: 50.0
        damping:
          waist_yaw: 10.0
          .*_shoulder_pitch: 5.0
          .*_shoulder_roll: 5.0
          .*_shoulder_yaw: 5.0
          .*_elbow_pitch: 5.0
        armature: null
        friction: null
