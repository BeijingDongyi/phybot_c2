        left_hip_roll: 0.029
        left_hip_yaw: 0.007
        left_knee: 0.49
        left_ankle_pitch: -0.295
        left_ankle_roll: 0.0
        right_hip_pitch: -0.242
        right_hip_roll: -0.029
        right_hip_yaw: -0.007
        right_knee: 0.49
        right_ankle_pitch: -0.295
        right_ankle_roll: 0.0
        waist_yaw: 0.0
        left_shoulder_pitch: 0.0
