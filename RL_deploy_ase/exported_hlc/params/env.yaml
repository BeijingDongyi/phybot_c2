        class_type: isaaclab.actuators.actuator_pd:ImplicitActuator
        joint_names_expr:
        - .*_hip_pitch
        - .*_hip_roll
        - .*_hip_yaw
        - .*_knee
        effort_limit: null
        velocity_limit: null
        effort_limit_sim:
          .*_hip_pitch: 200.0
          .*_hip_roll: 80.0
          .*_hip_yaw: 58.0
          .*_knee: 80.0
        velocity_limit_sim:
          .*_hip_pitch: 99.21
          .*_hip_roll: 98.9
          .*_hip_yaw: 98.37
          .*_knee: 98.9
        stiffness:
          .*_hip_pitch: 100.0
          .*_hip_roll: 100.0
          .*_hip_yaw: 100.0
          .*_knee: 100.0
        damping:
          .*_hip_pitch: 10.0
          .*_hip_roll: 10.0
          .*_hip_yaw: 10.0
          .*_knee: 10.0
        armature: null
        friction: null
