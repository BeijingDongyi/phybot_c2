            - 0.2
            - 0.8
            - 0.2
            emissive_color: !!python/tuple
            - 0.0
            - 0.0
            - 0.0
            roughness: 0.5
            metallic: 0.0
            opacity: 1.0
          physics_material_path: material
          physics_material: null
          radius: 0.02
      decimation: 10
    far_out_of_range_value: .inf
    near_out_of_range_value: .inf
