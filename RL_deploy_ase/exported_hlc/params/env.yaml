    width: 480
    height: 270
    semantic_filter: '*:*'
    colorize_semantic_segmentation: true
    colorize_instance_id_segmentation: true
    colorize_instance_segmentation: true
    semantic_segmentation_mapping: {}
    enable_depth_camera: false
    prim_body_name: pelvis/depth_camera
    max_range: 15.0
    min_range: 0.2
    sensor_noise:
      enable: false
      mode: gaussian
      depth_std: 0.01
      depth_std_multiplier: 0.01
      dropout_prob: 0.01
      dropout_value: 0.0
    visualizer_cfg:
      prim_path: /World/Visuals/CameraPointCloud
      markers:
